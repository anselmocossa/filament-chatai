version: 2

updates:
  # The library's own constraints and the dev tooling (Pest, Pint, Testbench).
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Africa/Maputo"
    open-pull-requests-limit: 5
    # Let a release settle before a pull request is opened, so a version that
    # gets yanked or patched in its first days never reaches the test matrix.
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      # One pull request for the tooling, so the matrix runs once for all of it.
      dev-tooling:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "composer"
      include: "scope"

  # The actions in .github/workflows, which are pinned to a commit SHA.
  # Dependabot moves the SHA and keeps the version comment in step.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Africa/Maputo"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
